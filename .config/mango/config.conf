# Include
source=~/.config/mango/bind.conf
source=~/.config/mango/appearance.conf
source=~/.config/mango/animation.conf
source=~/.config/mango/autostart.conf
source=~/.config/mango/tagrule.conf

# Monitor
monitor_rule=name:^VGA-1$,width:1680,height:1050,refresh:59.954,x:0,y:0,primary:1
monitor_rule=name:^LVDS-1$,width:1600,height:900,refresh:60.008,x:1680,y:0
allow_tearing=2

## Layout

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1


# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0


# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0


# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0


# Deck Layout Setting
deck_tab_mode=1


# Global Setting
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=1
focus_direction_only_zone_overlap=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=16
cursor_theme=white-cursor
drag_tile_to_tile=1
drag_tile_small=1
tag_num=9

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Keyboard Setting
repeat_rate=40
repeat_delay=250
numlock_on=1
xkb_rules_layout=us,ara
xkb_rules_options=caps:return,grp:lalt_lshift_toggle

# Mouse Setting
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mouse_natural_scrolling=0
