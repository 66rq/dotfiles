# Reload
bind=SUPER+SHIFT,r,reload_config


# Menu and Terminal
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,Return,spawn,foot

# Wallpaper Selector
bind=SUPER+ALT+CTRL,W,spawn_shell,$HOME/.config/mango/scripts/rofi-wal-selector.sh

# Exit and Kill Window
bind=SUPER+CTRL+ALT,q,quit
bind=SUPER,q,killclient,


# Switch Window Focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down


# Move Window
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,l,move_client,right


# Switch Window Status
bind=ALT,Tab,togglejump,
bind=SUPER,space,togglefloating,
bind=SUPER,f,togglefullscreen,


# Scroller Layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=SUPER+ALT+CTRL,Left,scroller_stack,left
bind=SUPER+ALT+CTRL,Right,scroller_stack,right
bind=SUPER+ALT+CTRL,Up,scroller_stack,up
bind=SUPER+ALT+CTRL,Down,scroller_stack,down


# Dwindle Layout (Manual Split Mode)
bind=ALT+SHIFT,Return,dwindle_toggle_split_direction


# Switch Layout
bind=SUPER+ALT+CTRL,l,switch_layout


# Tag Switch
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0


# Move Client Between Tags
# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9


# Monitor Switch
bind=SUPER,n,focusmon,left
bind=SUPER,m,focusmon,right
bind=SUPER+SHIFT,n,tagmon,left
bind=SUPER+SHIFT,m,tagmon,right


# Gaps
bind=SUPER+ALT+CTRL,i,incgaps,1
bind=SUPER+ALT+CTRL,d,incgaps,-1
bind=SUPER+ALT+CTRL,g,togglegaps


# Resize Window
bind=SUPER+ALT,k,resizewin,+0,-50
bind=SUPER+ALT,j,resizewin,+0,+50
bind=SUPER+ALT,h,resizewin,-50,+0
bind=SUPER+ALT,l,resizewin,+50,+0

# AXIS / TRACKPAD / GESTURES

# --- Axis Bindings ---
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


#  Trackpad Settings
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1


#  Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview


# Unused

