include=~/.config/foot/colors.ini
#font=IosevkaTerm NFM:style=Regular:size=12
#font=monospace:size=12
#font=Go Mono:style=Regular:size=12
#font=Space Mono:style=Regular:size=12
#font=Spleen:style=Medium:size=13
font=gallant12x22:size=13
initial-window-size-pixels=1000x600
term=xterm-256color
title=foot
letter-spacing=0
dpi-aware=no
pad=7x7
bold-text-in-bright=no
shell=bash

[scrollback]
lines=10000

[cursor]
style=block
blink=no
beam-thickness=1.5
underline-thickness=2
[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0


[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
delete-prev-word=Control+BackSpace
